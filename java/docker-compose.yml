services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: coolroom
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: cool
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d coolroom"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/coolroom
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: cool
      SPRING_SQL_INIT_MODE: always
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: